services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ai_merge_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "python -m alembic upgrade head && python -m alembic check"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/ai_merge_db
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      # Убираем строку volumes со скачиванием хост-директории поверх контейнера:
      # volumes:
      #   - ./backend:/app
      ports:
        - "127.0.0.1:8001:8000"
      environment:
        - DATABASE_URL=postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/ai_merge_db
        - REDIS_URL=redis://redis:6379/0
        - OFFLINE_DEMO_MODE=false
        - PYTHONPATH=/app
        - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:?Set TOKEN_ENCRYPTION_KEY}
        - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:?Set SESSION_SECRET_KEY}
        - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:?Set GITHUB_WEBHOOK_SECRET}
      depends_on:
        migrate:
          condition: service_completed_successfully
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy

volumes:
  pgdata:
