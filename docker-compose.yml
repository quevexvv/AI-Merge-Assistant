services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_merge_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      # Убираем строку volumes со скачиванием хост-директории поверх контейнера:
      # volumes:
      #   - ./backend:/app
      ports:
        - "8001:8000"
      environment:
        - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/ai_merge_db
        - REDIS_URL=redis://redis:6379/0
        - OFFLINE_DEMO_MODE=false
        - PYTHONPATH=/app
      depends_on:
        - postgres
        - redis

volumes:
  pgdata:
