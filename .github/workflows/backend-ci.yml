name: Backend CI (I0)

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main, 'feature/**']

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-llm.txt
            backend/requirements-input.txt
            backend/requirements-input-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-llm.txt -r requirements-input-dev.txt

      - name: Lint application and core tests
        run: >-
          python -m ruff check app/ tests/
          --exclude app/services/llm,app/services/parsing,app/services/validation,app/services/export,tests/input_quality

      - name: Lint LLM module
        run: |
          python -m ruff check --isolated --target-version py313 --line-length 100 \
            --select E,F,I,UP,B --config 'lint.isort.known-first-party=["app"]' app/services/llm
          python -m ruff format --check --isolated --target-version py313 --line-length 100 app/services/llm

      - name: Lint input, quality and export modules
        working-directory: .
        run: |
          python -m ruff check --config backend/ruff-input.toml \
            backend/app/services/parsing backend/app/services/validation \
            backend/app/services/export backend/tests/input_quality
          python -m ruff format --check --config backend/ruff-input.toml \
            backend/app/services/parsing backend/app/services/validation \
            backend/app/services/export backend/tests/input_quality

      - name: Run Pytest
        run: python -m pytest -v
